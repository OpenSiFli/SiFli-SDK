<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#55606e"/>
    </marker>
  </defs>

  <!-- 第一行：IDLE → SESSION → ERASING → TRANSFERRING -->
  <rect x="20" y="34" width="80" height="42" rx="8" fill="#f0f5fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="60" y="60" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1f2d3d">IDLE</text>

  <line x1="100" y1="55" x2="166" y2="55" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="134" y="47" text-anchor="middle" font-size="11.5" fill="#7a8699">开始会话</text>

  <rect x="168" y="34" width="100" height="42" rx="8" fill="#f0f5fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="218" y="60" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1f2d3d">SESSION</text>

  <line x1="268" y1="55" x2="334" y2="55" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="302" y="47" text-anchor="middle" font-size="11.5" fill="#7a8699">擦除</text>

  <rect x="336" y="34" width="100" height="42" rx="8" fill="#f0f5fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="386" y="60" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1f2d3d">ERASING</text>

  <line x1="436" y1="55" x2="518" y2="55" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="520" y="34" width="150" height="42" rx="8" fill="#f0f5fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="595" y="60" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1f2d3d">TRANSFERRING</text>

  <!-- 写入循环自环 -->
  <path d="M565,34 C565,10 625,10 625,32" fill="none" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="11" text-anchor="middle" font-size="11.5" fill="#7a8699">写入循环</text>

  <!-- TRANSFERRING → VERIFYING -->
  <path d="M595,76 L595,120 L223,120 L223,166" fill="none" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="409" y="113" text-anchor="middle" font-size="11.5" fill="#7a8699">校验</text>

  <!-- 第二行：VERIFYING → COMMITTING → COMPLETE -->
  <rect x="168" y="170" width="110" height="42" rx="8" fill="#f0f5fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="223" y="196" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1f2d3d">VERIFYING</text>

  <line x1="278" y1="191" x2="378" y2="191" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="183" text-anchor="middle" font-size="11.5" fill="#7a8699">成功</text>

  <rect x="380" y="170" width="120" height="42" rx="8" fill="#f0f5fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="440" y="196" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1f2d3d">COMMITTING</text>

  <line x1="500" y1="191" x2="588" y2="191" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="590" y="170" width="110" height="42" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="645" y="196" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#1b5e20">COMPLETE</text>

  <!-- VERIFYING → ERROR -->
  <line x1="223" y1="212" x2="223" y2="260" stroke="#55606e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="243" y="240" font-size="11.5" fill="#7a8699">失败</text>

  <rect x="168" y="264" width="110" height="42" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/>
  <text x="223" y="290" text-anchor="middle" font-size="13" font-family="Consolas,Menlo,monospace" fill="#8b1e1e">ERROR</text>
</svg>
