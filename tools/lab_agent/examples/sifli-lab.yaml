# SiFli SDK 自动化测试 —— 实验机配置（示例；真实端口/序列号请勿提交）
#
# 这个文件只由 Lab Agent 读取：`python tools/lab_agent/runner.py -c <本文件>`
# 读 runner: 与 testbed: 两块。SDK 侧不读它——跑用例时用 -p 指定平台，
# 名字取下面某个 testbed 的 platform。
#
#   python tools/lab_agent/runner.py -c E:\code2\lab\sifli-lab.yaml --check
#   python tools/lab_agent/runner.py -c E:\code2\lab\sifli-lab.yaml --list
#   sdk.py test plan -T example/get-started/hello_world -p sf32lb52-lcd_a128r16
#   sdk.py test run  -T example/get-started/hello_world -p sf32lb52-lcd_a128r16
#
# 52 板没有 J-Link 探针：烧录走 sftool（UART 下载），下载结束自己启动镜像，
# 因此复位记为 auto；56 板接了 J-Link，烧录与复位都走探针。

runner:
  name: local
  host: 127.0.0.1          # 本机 HTTP，没有认证，不要改成 0.0.0.0
  port: 8760
  console_poll: 0.2
  max_buffer: 4194304      # 每个 testbed 保留的串口文本上限（字符）

testbed:
  - id: sf32lb52-lcd_a128r16_01
    platform: sf32lb52-lcd_a128r16     # 不带核后缀即可，会补成 _hcpu
    runner: local

    console:
      port: COM8             # USB-Enhanced-SERIAL CH343；也是 UART 下载口
      baud: 1000000          # SDK 控制台固定 1 Mbaud（drv_usart.c）

    # 接了一台 BLE 对端仪表（第二块板，跑固定固件、不编译不烧录）：
    # COM22 是仪表自己的控制台。用例里写 harness_config.fixture: ble_peer 即可；
    # 仪表固件用 example/ble/central_and_peripheral/project/hcpu 编译，烧一次即固定。
    connections:
      - fixture: ble_peer
        console:
          port: COM22          # USB-Enhanced-SERIAL-B CH342 (interface B); the peer instrument
          baud: 1000000

    # -- 以下两块是 Lab-Agent 私有，SDK 侧只解析不解释 --

    flash:
      method: sftool         # UART 下载。下载口就是 console 口，所以框架会保证
                             # 烧录发生在开串口【之前】。
                             # -m 的 nor/nand 从构建产物的 sftool_param.json 自动取，
                             # 这块板是 NAND（JLINK_DEVICE = SF32LB52X_NAND）。
      # sftool 随 SDK python 环境安装；export.ps1 之后应在 PATH 上。
      # 找不到时报 "Cannot find the `sftool` command"，用下面这行 pin 住：
      # sftool: C:\Users\rabbi\AppData\Local\sftool\sftool.exe

    reset:
      method: auto           # 框架不碰探针，也不需要人——下载结束跑起新镜像，
                             # 那就是这块板的一次复位。
                             #
                             # auto 与 manual 的区别只有一条：启动是不是必然发生。
                             # 这块板实测【启动是必然的】：sftool 下载结束时 ROM 会
                             # 跳到新镜像自己启动一次，而打开 console 口时 pyserial
                             # 又可能用 DTR/RTS 再复位一次。所以不需要任何人做任何
                             # 事，也不会停下来问。
                             #
                             # 因为启动是保证的，写型 harness（一启动就发 unity_run
                             # 的 unity）在这里可以直接跑——命令不会被随后的复位冲掉。
                             #
                             # 如果哪天换了块板子、启动不再有保证（比如烧完要人按
                             # 复位键才起来），就改成 manual：那时框架会在串口打开后
                             # 停下来问一次，由人按板上的复位键，窗口 = 用例的 timeout。
                             # manual 模式下 wdt_script 不会执行，看门狗不关。

    # 没有 jlink: 块，也不需要——auto 复位 + sftool 烧录的组合下，
    # 框架不会构造探针（TestBedRuntime.needs_jlink() 为假）。

  # ---------------------------------------------------------------- 56x board
  # Commented out for now: this board is not on the bench, and its COM22 is the
  # BLE peer instrument of the 52x testbed above. Two testbeds must never name
  # the same physical port -- an agent that opened both would fight over it.
  # Restore the block (with this board's actual console port) when it is back.
  #
  # - id: sf32lb56-lcd_a128r12n1_01
  #   platform: sf32lb56-lcd_a128r12n1
  #   runner: local
  #
  #   console:
  #     port: COM22            # USB-Enhanced-SERIAL-B CH342 (interface B); this board's console
  #     baud: 1000000          # SDK console is fixed at 1 Mbaud (drv_usart.c)
  #
  #   jlink:
  #     serial: "69660307"     # this machine's probe; -SelectEmuBySN when there are several
  #     # device is omitted: it is read from
  #     # customer/boards/sf32lb56-lcd_a128r12n1/hcpu/rtconfig.py -> SF32LB56X_NAND
  #     # wdt_script: tools/segger/halt_all_cpu_and_disable_all_wdt_56x.jlink
  #     #   ^ enable it if this board's watchdog reboots mid-test
  #
  #   flash:
  #     method: jlink          # program through the probe, using the loadbin entries of build_<board>/download.jlink
  #
  #   reset:
  #     method: jlink          # probe reset; boot is guaranteed, so nobody has to press a button

