[project]
name = "sifli-sdk-tools-default"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "coverage",
  "jsonschema",
  "junit_xml",
  "python-gitlab",
  "pyyaml",
  "SimpleWebSocketServer",
  "pylint-gitlab",
  "minio",
  "prettytable",
  "setuptools",
  "packaging",
  "requests",
  "click",
  "pyserial",
  "cryptography",
  "pyparsing",
  "pyelftools",
  "construct",
  "rich",
  "psutil",
  "scons",
  "pycryptodome",
  "tqdm",
  "tomli_w",
  "conan",
  "semantic_version",
  "json5",
  "windows-curses; sys_platform == 'win32'",
  "crccheck",
  "questionary",
  # Needed only by test cases that declare `harness: pytest`. The `console` and
  # `unity` harnesses -- and the test framework's own self-tests -- are pure
  # standard library, so this is not required to use the framework, only to run
  # a suite that brings its own Python.
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
