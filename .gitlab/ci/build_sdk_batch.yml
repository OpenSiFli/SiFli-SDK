.build_sdk_batch_template:
  tags:
    - build
  script:
    - BUILD_JOB_ENV="$(python3 tools/ci/resolve_build_job.py --config "$BUILD_CONFIG" --batch-index "$BATCH_INDEX" --node-index "$CI_NODE_INDEX")" || exit 1
    - eval "$BUILD_JOB_ENV"
    - if [ "$BUILD_BATCH_SKIP" = "1" ]; then echo "No build assigned to this parallel slot"; exit 0; fi
    - source ./export.sh
    - bash tools/ci/build_job.sh
  after_script:
    - |
      BUILD_JOB_ENV="$(python3 tools/ci/resolve_build_job.py --config "$BUILD_CONFIG" --batch-index "$BATCH_INDEX" --node-index "$CI_NODE_INDEX")" || exit 0
      eval "$BUILD_JOB_ENV"
      if [ "$BUILD_BATCH_SKIP" = "1" ]; then exit 0; fi
      REPORT_STATUS=failed
      if [ "$CI_JOB_STATUS" = "success" ]; then REPORT_STATUS=success; fi
      python3 tools/ci/write_build_junit.py \
        --status "$REPORT_STATUS" \
        --output "job_status/${LOG_NAME}.junit.xml" \
        --name "$LOG_NAME" \
        --project "$PROJECT_PATH" \
        --board "$BOARD" || echo "JUnit report generation failed"
  artifacts:
    reports:
      junit: job_status/*.junit.xml
    paths:
      - ci_build_logs/
      - artifacts/
      - job_status/
    expire_in: 1 day
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always

.collect_sdk_batch_template:
  tags:
    - build
  when: always
  script:
    - python3 tools/ci/collect_artifacts_simple.py --output-dir merged_artifacts
    - python3 tools/ci/collect_artifacts_simple.py --failed-only --output-dir failed_merged_artifacts
  artifacts:
    paths:
      - merged_artifacts/
      - failed_merged_artifacts/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
