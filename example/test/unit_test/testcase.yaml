# Device-side unit tests, parsed from Unity's own output.
#
# The firmware runs every registered suite once at boot (TEST_FWK_AUTORUN, set
# in project/proj.conf) and the host reads that transcript. One entry per
# carrier, not per suite: which suites the image holds is a build fact, and
# src/SConscript already writes it to unity_suites_gen.json. Listing them again
# here would be one fact in two places, which is how the two come to disagree --
# so they come back out of the transcript instead, every result line tagged with
# the suite the runner gave it.
#
# The suites cover pure-logic modules only, so they need no peripheral and no
# stubbing, and run on any board.
tests:
  # The same image, two carriers. This is the point of the backend split: the
  # QEMU entry differs only in naming its platform directly, and needs no
  # hardware, no Lab Agent and no binding file.
  - id: unit_test.qemu
    description: The unit suites under QEMU -- the same cases as on a board, with no board.
    harness: unity
    tags: [unit, qemu]
    timeout: 120
    # Two fields, two jobs, and both are needed. integration_platforms is where
    # this case goes when nothing names a platform -- it is a default, and
    # `-p <board>` replaces it outright, which is how a case called "qemu" once
    # ran on real hardware. platform_allow is the hard gate that stops that: it
    # applies even when `-p` names a board, so the case can only ever run under
    # QEMU. Drop the first and the case is unplannable with no `-p`; drop the
    # second and `-p` drags it onto a bench.
    # qemu_sf32lb52x, and it has to be a carrier that names a chip: the suites
    # include circular_buf, which reaches bf0_hal.h through ipc_hw.h. The
    # chipless qemu_cortex_m33 carrier this case first ran on has been deleted;
    # every qemu_* carrier left in the tree selects one. Both fields change
    # together -- see the note above for why leaving one behind makes the case
    # unplannable.
    platform_allow: [qemu_sf32lb52x]
    integration_platforms: [qemu_sf32lb52x]
    harness_config:
      autorun: true

  - id: unit_test.board
    description: The unit suites on a board from the lab.
    harness: unity
    tags: [unit]
    timeout: 120
    harness_config:
      autorun: true
