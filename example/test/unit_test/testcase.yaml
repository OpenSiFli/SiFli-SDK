# Device-side unit tests, parsed from Unity's own output.
#
# Unity runs on the target and prints its own verdict; the host only sends
# "unity_run <suite>" over the serial port and reads what comes back. One
# entry per suite, because that is the filter unit the on-device runner
# matches on (middleware/test_fwk/include/sifli_unity.h) -- all three entries
# are served by the same binary built from this directory.
#
# The suites cover pure-logic modules only, so they need no peripheral and no
# stubbing, and run on any board.
tests:
  # The same binary, two carriers. This is the point of the backend split: the
  # QEMU entry differs only in naming its platform directly, and needs no
  # hardware, no Lab Agent and no binding file.
  - id: unit_test.cjson_qemu
    description: cJSON suite under QEMU -- the same cases as on a board, with no board.
    harness: unity
    type: unit
    tags: [unit, qemu]
    timeout: 120
    integration_platforms: [qemu_cortex_m33]
    harness_config:
      cmd: unity_run
      suite: cjson

  - id: unit_test.lz4
    description: LZ4 block round trip, incompressible input, and size boundaries.
    harness: unity
    type: unit
    tags: [unit]
    timeout: 120
    harness_config:
      cmd: unity_run
      suite: lz4

  - id: unit_test.cjson
    description: cJSON parse and value read-back, malformed input, and lookups past the edges.
    harness: unity
    type: unit
    tags: [unit]
    timeout: 120
    harness_config:
      cmd: unity_run
      suite: cjson

  - id: unit_test.circular_buf
    description: Ring buffer fill/drain, wraparound, and the full/empty boundaries.
    harness: unity
    type: unit
    tags: [unit]
    timeout: 120
    harness_config:
      cmd: unity_run
      suite: circular_buf
