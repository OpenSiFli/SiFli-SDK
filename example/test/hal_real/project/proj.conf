CONFIG_RT_USING_UNITY=y
CONFIG_USING_TEST_FWK=y

# Report every suite once at boot, so the host only has to read the console
# rather than sending a command into a board nothing can reset. Set to n for a
# board that waits for one instead -- the msh commands work either way.
CONFIG_TEST_FWK_AUTORUN=y

# The HAL is compiled into the image. That is not set here: the switch is
# promptless, so assigning it is a build failure -- see Kconfig.proj, which
# declares it with a `default y` instead.
