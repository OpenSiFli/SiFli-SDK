CONFIG_BSP_USING_SDIO=y
CONFIG_BSP_USING_SDMMC2=y
CONFIG_SDIO2_CARD_MODE=2
CONFIG_AIC_WLAN_AIC8800D40N=y
CONFIG_CHIP_SELECT_AIC8800D40N=y
CONFIG_AIC8800_RX_MODE_IRQ_IN_ISR=y
CONFIG_AIC8800_USE_RT_WLAN=y
CONFIG_AIC8800_RTOS_WIRELESS_PWR_VIA_IOEXP=y
CONFIG_AIC8800_RTOS_WIRELESS_PWR_IOEXP_PIN=0x15
CONFIG_AIC8800_RTOS_WIRELESS_PWR_IOEXP_PIN_KEY=0x14

# Stacks: the driver starts itself before main (INIT_APP_EXPORT) and the AP
# path calls into lwIP, so both threads need room.
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_FINSH_THREAD_STACK_SIZE=6144
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_SDIO_THREAD_PRIORITY=9
CONFIG_DFS_FILESYSTEMS_MAX=4
CONFIG_DFS_FILESYSTEM_TYPES_MAX=4

# Wi-Fi AP + IPv4. LWIP_USING_DHCPD is what makes the peer a usable access
# point: when the AP comes up the framework starts a DHCP server on the AP
# netif, so a DUT that associates gets an address from 192.168.169.0/24. That
# lease is the second half of the evidence a suite asserts on.
CONFIG_RT_USING_WIFI=y
CONFIG_RT_WLAN_DEBUG=y
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_LWIP_USING_DHCPD=y
CONFIG_RT_LWIP_TCPTHREAD_PRIORITY=8
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_STACKSIZE=4096
CONFIG_RT_USING_PTHREADS=y
# CONFIG_RT_USING_POSIX is not set

# The protocol shares this console with ulog. Colour reset codes are emitted
# before the next line, so they would glue onto an "@ok"/"@evt" line; the host
# strips ANSI as a second line of defence, but the instrument should not emit
# it on this UART at all.
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_COLOR=n
CONFIG_ULOG_OUTPUT_THREAD_NAME=y

# One protocol line goes out in a single console write, so the buffer has to
# hold the longest line and the shell has to accept the longest request.
CONFIG_RT_CONSOLEBUF_SIZE=1024
CONFIG_RT_USING_FINSH=y
CONFIG_FINSH_USING_MSH=y
CONFIG_FINSH_CMD_SIZE=1024
