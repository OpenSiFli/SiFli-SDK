# 58X builds the Classic (BR/EDR) instrument. The LCPU controller takes the
# same AddLCPU path as every other chip; these three options describe how the
# 58X boot path runs it.
CONFIG_LCPU_CONFIG_V2=y
CONFIG_HCI_DISABLE=y
CONFIG_LCPU_RUN_SEPERATE_IMG=y
CONFIG_PEER_CLASSIC=y

# Classic host side: the btc commands and the SPP profiles. Both roles are
# registered because the peer may be either end of an SPP link.
CONFIG_BT_FINSH=y
CONFIG_BT_PROFILE_CUSTOMIZE=y
CONFIG_CFG_SPP_CLT=y
CONFIG_CFG_SPP_SRV=y
CONFIG_BT_CON_NUM_CUSTOMIZE=y
CONFIG_CFG_MAX_BT_ACL_NUM=2
CONFIG_CFG_MAX_BT_BOND_NUM=2
