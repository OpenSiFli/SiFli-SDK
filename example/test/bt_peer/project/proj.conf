CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
# The protocol shares this console with ulog. Colour reset codes are emitted
# before the next line, so they would glue onto an "@ok"/"@evt" line and hide
# it from the host's parser. The host strips ANSI too, as a second line of
# defence, but the instrument should not produce it on this UART at all.
CONFIG_ULOG_USING_COLOR=n
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_PKG_USING_FLASHDB=y
CONFIG_BLUETOOTH=y

# The instrument drives both GAP roles and acts as a GATT client.
CONFIG_BLE_GAP_CENTRAL=y
CONFIG_BLE_GATT_CLIENT=y
CONFIG_BSP_BLE_CONNECTION_MANAGER=y

# Long protocol lines: one line must hold a 244-byte hex payload.
CONFIG_RT_CONSOLEBUF_SIZE=1024
CONFIG_RT_USING_FINSH=y
CONFIG_FINSH_USING_MSH=y
CONFIG_FINSH_CMD_SIZE=1024
