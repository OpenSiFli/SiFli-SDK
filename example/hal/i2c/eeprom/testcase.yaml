# example/hal/i2c/eeprom writes four bytes to an AT24C08SC at 7-bit address 0x50 and reads them
# back, driving the I2C HAL directly (project/proj.conf leaves CONFIG_BSP_USING_I2C2/I2C3/I2C6
# off.
# HAL_OK is 0 and HAL_ERROR is 1: ret:1 means the transfer failed.

tests:
  - id: hal_i2c_eeprom.boot
    description: Write four bytes to the AT24C08SC at 0x50 and read them back over the I2C HAL
    harness: console
    tags: [console, hal, i2c_eeprom, smoke]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb57-lcd_n16r16_dpi
      - sf32lb57-lcd_n16r16_qspi
      - sf32lb57-lcd_n16r8_dpi
      - sf32lb57-epd_n16r16
    integration_platforms: [sf32lb52-lcd_n16r8, sf32lb56-lcd_n16r12n1, sf32lb58-lcd_n16r64n4, sf32lb57-lcd_n16r16_dpi]
    harness_config:
# The read-back value stays a wildcard on purpose: the current example reads 0x0 from every
# register even after a successful write (no write-cycle delay before the read), so pinning
# 0x11..0x44 here would turn that example defect into a red case. The write side is pinned.
      record:
        - 'Start i2c eeprom demo!'
        - 'EEPROM_init0'
        - 'i2c write addr:0x1,data:0x11,ret:0'
        - 'i2c write addr:0x2,data:0x22,ret:0'
        - 'i2c write addr:0x3,data:0x33,ret:0'
        - 'i2c write addr:0x4,data:0x44,ret:0'
        - 'i2c read reg:0x1,pdata:0x11,ret:0'
        - 'i2c read reg:0x2,pdata:0x22,ret:0'
        - 'i2c read reg:0x3,pdata:0x33,ret:0'
        - 'i2c read reg:0x4,pdata:0x44,ret:0'
        - 'i2c eeprom end!'
