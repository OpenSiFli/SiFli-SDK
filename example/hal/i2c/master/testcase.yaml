# Initialise I2C on the master board and put the four-byte payload on the bus, then read four
# bytes back.
# Known failure mode: when the slave board is reflashed while this example is running, the
# master's I2C unit stays busy and never recovers without a reset.
# On the 58 boards the example drives I2C6 on PB28 (SCL) and PB29 (SDA), which the DevKit-LCD
# header exposes as IO3 and IO2; wire those two pins and GND between the two boards.
# The boot case accepts either transmit result: with no slave on the bus the example prints
# "Master transmit failed: <code>", which still proves the transfer was attempted. Only the .peer
# case, which needs the slave board, requires "success".
# Negative check: change one byte of the expected payload (e.g. 0x44 to 0x45), or wire SDA to the
# wrong pad so the master cannot initialise; either way the record must fail.

tests:
  - id: i2c_master.boot
    description: Initialise I2C on the master board and put the four byte payload on the bus
    harness: console
    tags: [console, hal, i2c_master, smoke]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb57-lcd_n16r16_dpi
      - sf32lb57-lcd_n16r16_qspi
      - sf32lb57-lcd_n16r8_dpi
      - sf32lb57-epd_n16r16
    integration_platforms: [sf32lb52-lcd_n16r8, sf32lb56-lcd_n16r12n1, sf32lb58-lcd_n16r64n4, sf32lb57-lcd_n16r16_dpi]
    harness_config:
      record:
        - 'Start I2C Master Demo!'
        - 'I2C Master Init Success!'
        - '=== I2C Communication Test Start ==='
        - 'Master sending 4 bytes to slave 0x5A: 0x11 0x22 0x33 0x44'
        - 'Master transmit (success!|failed: [0-9]+)'

  - id: i2c_master.peer
    description: exchange data with the i2c slave example on the peer board
    harness: console
    tags: [console, hal, i2c, peer]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_n16r8
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r64n4
      - sf32lb56-lcd_n16r12n1
      - sf32lb57-lcd_n16r16_dpi
    integration_platforms: [sf32lb57-lcd_n16r16_dpi]
    harness_config:
      record:
        - 'Start I2C Master Demo!'
        - 'I2C Master Init Success!'
        - '=== I2C Communication Test Start ==='
        - 'Master sending 4 bytes to slave 0x5A: 0x11 0x22 0x33 0x44'
        - 'Master transmit success!'
        - 'Master reading 4 bytes from slave 0x5A'
        - 'Master receive success, data: 0xAA 0xBB 0xCC 0xDD'
        - '=== I2C Communication Test End ==='
