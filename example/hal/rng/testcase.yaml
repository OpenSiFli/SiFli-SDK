# rng initializes the TRNG and then, forever, fills a 16-word buffer and dumps it every 500 ms.
# Negative check: shrink RND_BUFFER_SIZE from 16 to 8 and the sixteen-word record never matches.

tests:
  - id: rng.boot
    description: TRNG dumps a 16-word buffer as two lines of eight hex words every 500 ms
    harness: console
    tags: [console, hal, rng, smoke]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
    integration_platforms: [sf32lb52-lcd_n16r8]
    harness_config:
      record:
        - 'RND_BUFFER:'
        - regex: '(?:\s+[0-9A-F]{8}){16}\s+RND_BUFFER:'
          repeat: 2
