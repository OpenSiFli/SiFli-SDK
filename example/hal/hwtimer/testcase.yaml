# example/hal/hwtimer exercises GPTIM1, ATIM1 and BTIM1 in single and repetitive mode, 3.5 s per
# period, all from main().

tests:
  - id: hwtimer.boot
    description: Run the GPTIM, ATIM and BTIM single and repetitive timers and check every interrupt count and END marker
    harness: console
    tags: [console, hal, hwtimer, smoke]
    timeout: 240
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
    integration_platforms: [sf32lb52-lcd_n16r8, sf32lb56-lcd_n16r12n1, sf32lb58-lcd_n16r32n1_dpi]
    project_dir: project
    harness_config:
      record:
        - 'HWTIM Example:'
        - 'GPTIM1: SINGLE\. Timeout is 3\.5 seconds'
        - 'Prescaler:\d+ PCLK:\d+ period:35000'
        - 'Timer init ok'
        - 'GPTIM1 timeout \d+'
        - 'GPTIM1: SINGLE\. END\.'
        - 'GPTIM1: REPETITIVE\. Timeout is 3\.5 seconds \* 10 times\.'
        - 'Prescaler:\d+ PCLK:\d+ period:35000'
        - 'Timer init ok'
        - regex: 'GPTIM1 timeout \d+'
          repeat: 10
        - 'GPTIM1: REPETITIVE\. END\.'
        - 'ATIM1: SINGLE\. Timeout is 3\.5 seconds'
        - 'Prescaler:\d+ PCLK:\d+ period:35000'
        - 'Timer init ok'
        - 'ATIM1 timeout \d+'
        - 'ATIM1: SINGLE\. END\.'
        - 'ATIM1: REPETITIVE\. Timeout is \(3\.5 \* 10\) seconds\.'
        - 'Prescaler:\d+ PCLK:\d+ period:35000'
        - 'Timer init ok'
        - 'ATIM1 timeout \d{5,}'
        - 'ATIM1: END\.'
        - 'BTIM1: SINGLE\. Timeout is 3\.5 seconds'
        - 'Prescaler:\d+ PCLK:\d+ period:35000'
        - 'Timer init ok'
        - 'BTIM1 timeout \d+'
        - 'BTIM1: SINGLE\. END\.'
        - 'BTIM1: REPETITIVE\. Timeout is 3\.5 seconds \* 10 times\.'
        - 'Prescaler:\d+ PCLK:\d+ period:35000'
        - 'Timer init ok'
        - regex: 'BTIM1 timeout \d+'
          repeat: 10
        - 'BTIM1: REPETITIVE\. END\.'
