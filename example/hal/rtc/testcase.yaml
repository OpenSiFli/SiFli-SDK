# rtc initializes the on-chip RTC from the external 32k crystal, sets the time to 2025-01-01
# 08:30:00, reads it back, sets an alarm for 08:31:00 and then prints the time once a second.
# Negative check: comment out the HAL_RTC_SetAlarm() call and "Alarm triggered." never appears, so
# rtc.boot must go red.

tests:
  - id: hal_rtc.boot
    description: RTC is set to 2025-01-01 08:30:00, keeps reading back, and the 08:31:00 alarm fires
    harness: console
    tags: [console, hal, rtc, smoke]
    timeout: 180
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
    integration_platforms: [sf32lb52-lcd_n16r8]
    harness_config:
      record:
        - 'RTC use LXT RTC_CR=[0-9A-F]{8}'
        - 'RTC Init success\.'
        - 'SET RTC TIME : Wed Jan  1 08:30:00 2025'
        - 'GET RTC TIME : Wed Jan  1 08:30:0\d 2025'
        - 'SET ALARM : \[8 31 0\]'
        - 'GET RTC TIME : Wed Jan  1 08:30:\d\d 2025'
        - 'Alarm triggered\.'
        - 'GET RTC TIME : Wed Jan  1 08:31:0\d 2025'
