# wdt1 starts WDT1 in "interrupt and reset" mode (__HAL_WDT_INT(&hwdt, 1), src/main.c:71): first
# round BSP_WDT_TIMEOUT = 10 s fires the interrupt, second round WDT_REBOOT_TIMEOUT = 60 s resets
# the chip.
# What it does not prove: that the 10 s timeout interrupt ever fires. Console records only match
# lines that appear, so a regression that turns the interrupt into reset-only still passes.
# Negative check: drop the HAL_WDT_Refresh call and the board resets after 10 s, so the second and
# third "Watchdog feeding." never appear and wdt_wdt1.boot goes red.

tests:
  - id: wdt_wdt1.boot
    description: WDT1 is configured for 10 s + 60 s and refreshed while the example feeds it
    harness: console
    tags: [console, hal, wdt, smoke]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
    integration_platforms: [sf32lb52-lcd_n16r8]
    harness_config:
      record:
        - 'WDT Example:'
        - 'WDT init OK\. Timeout: 10\(s\) Reload2: 60\(s\)'
        - 'WDT_CVR0:0x[0-9A-Fa-f]+ WDT_CVR1:0x[0-9A-Fa-f]+'
        - regex: 'Watchdog feeding\.'
          repeat: 3
