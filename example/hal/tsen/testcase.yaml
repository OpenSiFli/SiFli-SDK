# tsen reads the on-die temperature sensor. testcase() repeats the same sequence forever with a
# 500 ms pause: one blocking read and one interrupt driven read.
# Negative check: make HAL_TSEN_Init return an error and none of the lines below is printed, so
# both cases go red.

tests:
  - id: tsen.boot
    description: the blocking temperature read reports a value and the sensor state sequence starts
    harness: console
    tags: [console, hal, tsen, smoke]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
      - sf32lb57-lcd_n16r16_dpi
      - sf32lb57-lcd_n16r16_qspi
      - sf32lb57-lcd_n16r8_dpi
      - sf32lb57-epd_n16r16
    integration_platforms:
      - sf32lb52-lcd_a128r16
      - sf32lb57-lcd_n16r16_dpi
    harness_config:
      record:
        - 'Start tsen demo!'
        - 'Sync: Current temperature is -?\d+ degree'
        - 'state1:\d+'

  - id: tsen.async
    description: the interrupt driven temperature read completes and the ISR prints its line
    harness: console
    tags: [console, hal, tsen]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
    integration_platforms:
      - sf32lb52-lcd_a128r16
    harness_config:
      record:
        - 'Start tsen demo!'
        - regex: 'IRQ Fired'
          ordered: false
        - 'state2:1'
        - 'Async: Current temperature is -?\d+ degree'
