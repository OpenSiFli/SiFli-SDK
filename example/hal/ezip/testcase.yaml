# example/hal/ezip decompresses four embedded images from main() and compares each result with a
# reference buffer: EZIP AHB polling, EZIP AHB interrupt, LZ4 AHB polling, GZIP AHB polling.

tests:
  - id: ezip.boot
    description: Decompress the four embedded EZIP/LZ4/GZIP images and verify every output buffer
    harness: console
    tags: [console, hal, ezip, smoke]
    timeout: 120
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
      - sf32lb57-lcd_n16r16_dpi
      - sf32lb57-lcd_n16r16_qspi
      - sf32lb57-lcd_n16r8_dpi
      - sf32lb57-epd_n16r16
    integration_platforms: [sf32lb52-lcd_n16r8, sf32lb56-lcd_n16r12n1, sf32lb58-lcd_n16r32n1_dpi, sf32lb57-lcd_n16r16_dpi]
    project_dir: project
    harness_config:
      record:
        - '\[EZIP\]EZIP Example:'
        - '\[EZIP\]EZIP initialization OK\.'
        - '\[EZIP\]EZIP AHB \(polling mode\)\.'
        - '\[EZIP\]Output is correct\.'
        - '\[EZIP\]EZIP AHB \(polling mode\) +--- end\.'
        - '\[EZIP\]EZIP AHB \(intrInterrupt mode\)\.'
        - '\[EZIP\]ezip_done\.'
        - '\[EZIP\]Output is correct\.'
        - '\[EZIP\]EZIP AHB \(intrInterrupt mode\) +--- end\.'
        - '\[EZIP\]LZ4 AHB \(polling mode\)\.'
        - '\[EZIP\]Output is correct\.'
        - '\[EZIP\]LZ4 AHB \(polling mode\) +--- end\.'
        - '\[EZIP\]GZIP AHB \(polling mode\)\.'
        - '\[EZIP\]Output is correct\.'
        - '\[EZIP\]GZIP AHB \(polling mode\) +--- end\.'
