# aes is a self-checking example: main() encrypts a fixed 16-byte plaintext in CBC, CTR, ECB and
# CBC-interrupt mode and dumps plaintext, ciphertext and the decrypted result with dump_hex().
# Negative check: change one byte of the plaintext in src/main.c and the ciphertext lines below no
# longer match, so aes.boot must go red.

tests:
  - id: aes.boot
    description: CBC, CTR, ECB and interrupt-mode AES produce the README's ciphertext vectors
    harness: console
    tags: [console, hal, aes, smoke]
    timeout: 120
    project_dir: project
    platform_allow:
      - sf32lb52-lcd_52d
      - sf32lb52-lcd_a128r16
      - sf32lb52-lcd_n16r8
      - sf32lb52-lcd_n16r8_jdi
      - sf32lb56-lcd_a128r12n1
      - sf32lb56-lcd_n16r12n1
      - sf32lb58-lcd_a128r32n1_a1_dsi
      - sf32lb58-lcd_a128r32n1_dsi
      - sf32lb58-lcd_a128r32n1_qspi
      - sf32lb58-lcd_e4r32n1_dsi
      - sf32lb58-lcd_n16r16n1_qspi
      - sf32lb58-lcd_n16r32n1_a1_dpi
      - sf32lb58-lcd_n16r32n1_a1_dsi
      - sf32lb58-lcd_n16r32n1_dpi
      - sf32lb58-lcd_n16r32n1_dsi
      - sf32lb58-lcd_n16r32n1_qspi
      - sf32lb58-lcd_n16r64n4
    integration_platforms: [sf32lb52-lcd_n16r8]
    harness_config:
      record:
        - 'AES CBC Mode:'
        - 'Raw data:'
        - '0x43, 0x4a, 0x4b, 0x2f, 0x31, 0x38, 0x32, 0x31,'
        - '0x39, 0x31, 0x31, 0x32, 0x31, 0x35, 0x36, 0x2e,'
        - 'Encry\. ciphertext:'
        - '0xd5, 0xb2, 0xe1, 0x75, 0x68, 0x6d, 0xb2, 0x03,'
        - '0x63, 0x96, 0xe1, 0x70, 0xc3, 0xf9, 0xf4, 0xf3,'
        - 'Decry\. plaintext:'
        - '0x43, 0x4a, 0x4b, 0x2f, 0x31, 0x38, 0x32, 0x31,'
        - '0x39, 0x31, 0x31, 0x32, 0x31, 0x35, 0x36, 0x2e,'
        - 'AES CTR Mode:'
        - 'Encry\. ciphertext:'
        - '0x86, 0xe9, 0x35, 0x58, 0xb9, 0xdd, 0x7d, 0x0b,'
        - '0x74, 0x85, 0x6c, 0x07, 0x1a, 0xe1, 0xbd, 0x9c,'
        - 'Decry\. plaintext:'
        - '0x43, 0x4a, 0x4b, 0x2f, 0x31, 0x38, 0x32, 0x31,'
        - '0x39, 0x31, 0x31, 0x32, 0x31, 0x35, 0x36, 0x2e,'
        - 'AES ECB Mode:'
        - 'Encry\. ciphertext:'
        - '0x6d, 0xf0, 0x28, 0xcd, 0x3c, 0xf5, 0x29, 0x79,'
        - '0x85, 0x06, 0xb9, 0xba, 0x35, 0x34, 0xf9, 0x46,'
        - 'Decry\. plaintext:'
        - '0x43, 0x4a, 0x4b, 0x2f, 0x31, 0x38, 0x32, 0x31,'
        - '0x39, 0x31, 0x31, 0x32, 0x31, 0x35, 0x36, 0x2e,'
        - 'AES encryption interrupt mode:'
        - 'Encry\. ciphertext:'
        - '0xd5, 0xb2, 0xe1, 0x75, 0x68, 0x6d, 0xb2, 0x03,'
        - '0x63, 0x96, 0xe1, 0x70, 0xc3, 0xf9, 0xf4, 0xf3,'
