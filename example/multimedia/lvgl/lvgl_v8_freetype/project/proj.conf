# ============================================================
# FreeType Font Engine Configuration
# ============================================================
CONFIG_LV_USING_FREETYPE_ENGINE=y
# CONFIG_FREETYPE_TINY_FONT is not set
CONFIG_FREETYPE_NORMAL_FONT=y
# CONFIG_FREETYPE_FONT_BPP_DEFAULT is not set
CONFIG_FREETYPE_FONT_BPP_8=y
# FTC cache capacity. Faces are shared per font FILE (one parsed copy and
# one fd per file, whatever the number of sizes in use); the sizes cache
# holds one FT_Size per (file, size) pair. FreeType defaults (2/4) are too
# small once the UI uses several sizes at once (title/UI/button/preview).
CONFIG_LV_FREETYPE_CACHE_FT_FACES=4
CONFIG_LV_FREETYPE_CACHE_FT_SIZES=16
# Refuse fonts that do not fit this board (a full CJK font keeps hundreds of
# KB of index tables resident): the load fails instead of the system dying
# later on an unrelated allocation. The floor covers the switch window, where
# the old font is still resident while the new one is created.
CONFIG_LVSF_FONT_MIN_FREE_HEAP=32768

# ============================================================
# File System Configuration (for dynamic font loading)
# ============================================================
# Use FAL Flash partition as filesystem (not SD card)
CONFIG_RT_USING_DFS=y
CONFIG_RT_USING_DFS_ELMFAT=y
