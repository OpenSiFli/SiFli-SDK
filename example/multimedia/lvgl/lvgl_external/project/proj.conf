CONFIG_RT_MAIN_THREAD_STACK_SIZE=12288
CONFIG_RT_MAIN_THREAD_PRIORITY=19
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
CONFIG_ULOG_OUTPUT_FLOAT=y
# CONFIG_ULOG_USING_COLOR is not set
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_RT_TIMER_THREAD_STACK_SIZE=1024
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_MEMTRACE=y
CONFIG_BSP_USING_FULL_ASSERT=y

# The SDK LVGL integration stays disabled: the external library and its
# display/input port are built by this project.
# CONFIG_PKG_USING_LITTLEVGL2RTT is not set

CONFIG_PKG_USING_LVGL=y
CONFIG_PKG_LVGL_USING_DEMOS=y
CONFIG_PKG_LVGL_USING_EXAMPLES=n
CONFIG_EXAMPLE_LVGL_BENCHMARK=y

# Display port buffers.
CONFIG_LV_EXT_FB_TWO_PARTIAL=y
CONFIG_LV_EXT_FB_LINE_NUM=100

# The upstream EPIC renderer owns the hardware; keep the SDK EPIC driver and
# the SDK power management off.
CONFIG_BSP_USING_EPIC=n
CONFIG_BSP_USING_PM=n
