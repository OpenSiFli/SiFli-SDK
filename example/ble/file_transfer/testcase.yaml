# The peer path for the file_transfer example: the DUT is a GATT server using
# the shared "sifli_app" service, and bt_peer is the GATT client.
#
# This case transfers files too: the suite discovers the "sifli_sd" service,
# pushes a 32-byte file (one chunk) and a 52-byte one (two chunks) through the
# watchface download protocol with `file.push`, and checks that the DUT logged
# each path and wrote it to /file_recv/ (BT_PEER_DESIGN.md 13.3.1).
#
# Negative verification: break ble_app_service_init() and
# `test_peer_discovers_the_service` goes red; drop the memcpy in the write
# callback and the `Updated app value ... to:34` assertion goes red; remove
# `ble_app_start_send_thread()` (or the 0x1111 branch) and
# `test_notification_burst_reaches_the_peer` goes red; corrupt the pushed CRC
# (or stop writing the received bytes) and `test_peer_pushes_a_file` goes red
# on the DUT's result=36; power off the instrument and the first `peer info`
# never answers.
tests:
  - id: ble_file_transfer.peer
    description: A peer connects to the file_transfer server, discovers it, writes, reads, subscribes and receives a notification.
    harness: pytest
    tags: [pytest, ble, peer]
    timeout: 300
    harness_config:
      fixture: bt_peer:ble
      pytest_root: pytest
